<svg xmlns="http://www.w3.org/2000/svg" width="960" height="110" viewBox="0 0 960 110" role="img"><title>Build with intent. Keep exploring.</title><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.orbit{transform-origin:777px 166px;animation:spin 32s linear infinite}.orbit2{transform-origin:777px 166px;animation:spin 46s linear infinite reverse}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:pulse 1.8s ease-in-out infinite}.scan{animation:scan 9s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(280px)}}@media(prefers-reduced-motion:reduce){.orbit,.orbit2,.pulse,.cursor,.scan{animation:none}}</style><defs><linearGradient id="edge"><stop stop-color="#50e8ed"/><stop offset="1" stop-color="#a792ff"/></linearGradient><radialGradient id="halo"><stop stop-color="#a792ff" stop-opacity=".18"/><stop offset="1" stop-color="#a792ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#263650" stroke-width=".6"/></pattern></defs><rect width="960" height="110" rx="16" fill="#080e1d"/><path d="M32 30H928" stroke="#263650"/><path class="scan" d="M32 30H160" stroke="url(#edge)" stroke-width="2"/><text x="32" y="67" fill="#eef5ff" font-size="16">BUILD WITH INTENT.</text><text x="32" y="89" fill="#95a9c9" font-size="11" letter-spacing="1">KEEP EXPLORING.</text><text x="925" y="75" text-anchor="end" fill="#50e8ed" font-size="16">&lt; QiuuDev /&gt;</text></svg>