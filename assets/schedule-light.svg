<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img"><title>QIU&#x27;S SCHEDULE</title><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.orbit{transform-origin:777px 166px;animation:spin 32s linear infinite}.orbit2{transform-origin:777px 166px;animation:spin 46s linear infinite reverse}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:pulse 1.8s ease-in-out infinite}.scan{animation:scan 9s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(280px)}}@media(prefers-reduced-motion:reduce){.orbit,.orbit2,.pulse,.cursor,.scan{animation:none}}</style><defs><linearGradient id="edge"><stop stop-color="#007e88"/><stop offset="1" stop-color="#7354cf"/></linearGradient><radialGradient id="halo"><stop stop-color="#7354cf" stop-opacity=".18"/><stop offset="1" stop-color="#7354cf" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cddaea" stroke-width=".6"/></pattern></defs><rect x="1" y="1" width="958" height="198" rx="18" fill="#f2f7ff" stroke="#cddaea"/><rect x="20" y="20" width="920" height="160" fill="url(#grid)" opacity=".4"/><text x="42" y="52" fill="#007e88" font-size="11" letter-spacing="2">QIUUDEV / SELECTED WORK</text><text x="42" y="108" fill="#15223c" font-size="38" font-weight="bold">QIU&#x27;S SCHEDULE</text><text x="42" y="142" fill="#526780" font-size="15">Every plan, a little clearer. / PHP + MySQL</text><path class="scan" d="M42 170H202" stroke="url(#edge)" stroke-width="2"/></svg>